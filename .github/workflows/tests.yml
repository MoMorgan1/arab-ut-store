name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  mariadb-schema:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: arab_ut_test
      DB_USERNAME: arab_ut_test
      DB_PASSWORD: synthetic-test-password

    services:
      mariadb:
        image: mariadb:11.4.10
        env:
          MARIADB_DATABASE: arab_ut_test
          MARIADB_USER: arab_ut_test
          MARIADB_PASSWORD: synthetic-test-password
          MARIADB_ROOT_PASSWORD: synthetic-root-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verify schema migration lifecycle
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --force
          php artisan migrate --force

      - name: Run focused domain and cart tests on MariaDB
        run: >-
          php vendor/bin/pest --configuration phpunit.mariadb.xml
          tests/Feature/Database/DomainSchemaTest.php
          tests/Feature/Database/CartSecuritySchemaTest.php
          tests/Feature/Auth/RegistrationTest.php
          tests/Feature/Settings/ProfileUpdateTest.php
          tests/Feature/Store/CoinsCartTest.php
          tests/Feature/Console/PurgeCartItemSecretsTest.php
          tests/Integration/ActiveCartInvariantUpgradeTest.php
          tests/Integration/CoinsCartConcurrencyTest.php
          tests/Unit/Enums/OrderItemStatusTest.php
          tests/Unit/Enums/PlatformTest.php
          tests/Unit/Support/MoneyTest.php
