name: tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      AI_ASSISTANT_ENABLED: true
      AI_ASSISTANT_ROLLOUT: public
      AI_MODEL_PROVIDER: fake
      OPENAI_API_KEY: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke and agent stream
        id: browser-smoke
        run: >-
          npx playwright test
          tests/Browser/storefront-smoke.spec.ts
          tests/Browser/agent-stream.spec.ts
          tests/Browser/agent-restart.spec.ts
          --project=chromium

      - name: Upload Playwright report on smoke failure
        if: ${{ failure() && steps.browser-smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate deployment scripts
        run: bash -n deploy/*.sh

      - name: Package verified Hostinger release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          test -f public/build/manifest.json
          tar \
            --exclude=./.git \
            --exclude=./.github \
            --exclude=./.env \
            --exclude=./database/database.sqlite \
            --exclude=./node_modules \
            --exclude=./playwright-report \
            --exclude=./tests \
            --exclude=./test-results \
            --exclude=./vendor \
            --exclude=./public/hot \
            --exclude=./storage/logs \
            --exclude=./storage/framework/cache \
            --exclude=./storage/framework/sessions \
            --exclude=./storage/framework/views \
            -czf "${RUNNER_TEMP}/release.tar.gz" .

      - name: Upload verified Hostinger release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hostinger-release-${{ github.sha }}
          path: ${{ runner.temp }}/release.tar.gz
          if-no-files-found: error
          retention-days: 7

  mariadb-schema:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: arab_ut_test
      DB_USERNAME: arab_ut_test
      DB_PASSWORD: synthetic-test-password

    services:
      mariadb:
        image: mariadb:11.4.10
        env:
          MARIADB_DATABASE: arab_ut_test
          MARIADB_USER: arab_ut_test
          MARIADB_PASSWORD: synthetic-test-password
          MARIADB_ROOT_PASSWORD: synthetic-root-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verify schema migration lifecycle
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --force
          php artisan migrate --force

      - name: Run focused domain and cart tests on MariaDB
        run: >-
          php vendor/bin/pest --configuration phpunit.mariadb.xml
          tests/Feature/Database/DomainSchemaTest.php
          tests/Integration
          tests/Feature/Database/CartSecuritySchemaTest.php
          tests/Feature/Database/ActiveCartAcquisitionTest.php
          tests/Feature/Cart/CartOwnerRotationTest.php
          tests/Feature/Auth/GuestCartClaimTest.php
          tests/Feature/Auth/RegistrationTest.php
          tests/Feature/Settings/ProfileUpdateTest.php
          tests/Feature/Store/CoinsCartTest.php
          tests/Feature/Console/PurgeGuestCartClaimsTest.php
          tests/Feature/AI/AgentRuntimeSchemaTest.php
          tests/Feature/AI/AgentMessageEligibilityTest.php
          tests/Unit/Cart/CartOwnerTest.php
          tests/Unit/Enums/OrderItemStatusTest.php
          tests/Unit/Enums/PlatformTest.php
          tests/Unit/Support/MoneyTest.php
