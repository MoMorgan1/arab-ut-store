name: n8n-production-maintenance

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Safe production maintenance operation
        required: true
        type: choice
        default: discover
        options:
          - discover

permissions:
  contents: read

concurrency:
  group: n8n-production-maintenance
  cancel-in-progress: false

jobs:
  discover:
    if: inputs.operation == 'discover'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment:
      name: production
    env:
      HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}

    steps:
      - name: Configure pinned Hostinger SSH identity
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/hostinger
          chmod 600 ~/.ssh/hostinger
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Discover the managed n8n runtime
        run: |
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            -i ~/.ssh/hostinger -p "$HOSTINGER_SSH_PORT" \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            'bash -se' <<'REMOTE'
          set -euo pipefail

          command -v docker >/dev/null

          mapfile -t containers < <(
            docker ps --format '{{.Names}} {{.Image}}' |
              awk 'tolower($0) ~ /n8n/ { print $1 }'
          )

          if [ "${#containers[@]}" -ne 1 ]; then
            printf 'Expected exactly one running n8n container; found %s.\n' "${#containers[@]}" >&2
            exit 1
          fi

          container="${containers[0]}"
          version="$(timeout 20s docker exec "$container" n8n --version)"

          printf 'n8n container: %s\n' "$container"
          printf 'n8n version: %s\n' "$version"
          REMOTE
